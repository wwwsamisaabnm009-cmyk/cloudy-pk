
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Weather - Cloudy.pk</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-slate-100 min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="../../index.html" class="text-2xl font-bold">
                <i class="fa-solid fa-cloud-sun"></i>
                Cloudy.pk
            </a>

            <div class="flex gap-5">
                <a href="../../index.html" class="hover:text-blue-200">Home</a>
                <a href="manage-records.html" class="hover:text-blue-200">Manage Records</a>
                <a href="live-weather.html" class="font-semibold text-blue-200">Live Weather</a>
            </div>

        </div>
    </nav>


    <!-- MAIN CONTENT -->
    <main class="max-w-5xl mx-auto px-6 py-12">

        <div class="text-center mb-10">

            <h1 class="text-4xl font-bold text-slate-800">
                Live Weather Updates
            </h1>

            <p class="text-slate-600 mt-3">
                Search any city to check its current weather.
            </p>

        </div>


        <!-- SEARCH SECTION -->
        <section class="bg-white rounded-2xl shadow-md p-8 mb-8">

            <form id="weatherSearchForm" class="flex flex-col sm:flex-row gap-4">

                <input
                    type="text"
                    id="citySearch"
                    placeholder="Enter city name (e.g. Lahore)"
                    required
                    class="flex-1 border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                <button
                    type="submit"
                    id="searchButton"
                    class="bg-blue-700 hover:bg-blue-800 text-white px-8 py-3 rounded-lg font-semibold">

                    <i class="fa-solid fa-search"></i>
                    Search Weather

                </button>

            </form>

        </section>


        <!-- LOADING MESSAGE -->
        <div id="loadingMessage"
            class="hidden text-center text-blue-700 font-semibold p-5">

            <i class="fa-solid fa-spinner fa-spin"></i>
            Loading weather data...

        </div>


        <!-- ERROR MESSAGE -->
        <div id="errorMessage"
            class="hidden bg-red-100 text-red-700 p-5 rounded-xl text-center mb-6">
        </div>


        <!-- WEATHER RESULT -->
        <section id="weatherResult"
            class="hidden bg-white rounded-2xl shadow-lg p-8">

            <div class="text-center">

                <i id="weatherIcon"
                    class="fa-solid fa-cloud-sun text-6xl text-blue-600 mb-5">
                </i>

                <h2 id="resultCity"
                    class="text-3xl font-bold text-slate-800">
                </h2>

                <p id="resultCountry" class="text-slate-500 mt-1"></p>

                <p id="resultTemperature"
                    class="text-6xl font-bold text-blue-700 my-6">
                </p>

                <p id="resultCondition"
                    class="text-xl text-slate-600">
                </p>

            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mt-10">

                <div class="bg-blue-50 rounded-xl p-5 text-center">
                    <i class="fa-solid fa-droplet text-blue-600 text-2xl"></i>
                    <p class="text-slate-500 mt-2">Humidity</p>
                    <h3 id="resultHumidity" class="text-2xl font-bold"></h3>
                </div>

                <div class="bg-blue-50 rounded-xl p-5 text-center">
                    <i class="fa-solid fa-wind text-blue-600 text-2xl"></i>
                    <p class="text-slate-500 mt-2">Wind Speed</p>
                    <h3 id="resultWind" class="text-2xl font-bold"></h3>
                </div>

                <div class="bg-blue-50 rounded-xl p-5 text-center">
                    <i class="fa-solid fa-temperature-half text-blue-600 text-2xl"></i>
                    <p class="text-slate-500 mt-2">Feels Like</p>
                    <h3 id="resultFeelsLike" class="text-2xl font-bold"></h3>
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="bg-slate-800 text-white text-center py-5 mt-12">

        <p>© 2026 Cloudy.pk. All Rights Reserved.</p>

    </footer>


    <!-- LIVE WEATHER JAVASCRIPT -->
    <script src="js/live-weather.js"></script>

</body>
</html>
```
